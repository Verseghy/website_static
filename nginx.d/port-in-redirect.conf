# Included at http level by the image's /etc/nginx/nginx.conf
# (include /opt/app-root/etc/nginx.d/*.conf).
#
# nginx answers a directory URL without its trailing slash, such as
# /docs/szego, with a 301 to the same URL with the slash. Into that redirect's
# Location it writes the port that it listens on, unless that port is 80.
# This server listens on 8080 behind OpenShift Routes that take the requests
# on ports 80 and 443, so the default Location would be
# http://verseghy-gimnazium.net:8080/docs/szego/, a port that nothing answers
# on. The server that this image replaces listened on 80 and so never named a
# port. With port_in_redirect off, the Location is what it sent:
# http://<host>/docs/szego/, which the Route then redirects to https.
port_in_redirect off;
